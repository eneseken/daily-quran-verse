definitions:
  base_env: &base_env
    flutter: 3.38.2
    xcode: latest
    cocoapods: default

workflows:
  ios-unsigned:
    name: iOS build (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *base_env
    scripts:
      - name: Fetch packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Build unsigned .app
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app

  ios-release:
    name: iOS release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: Codemagic
    environment:
      <<: *base_env
      ios_signing:
        certificates:
          - cert
        provisioning_profiles:
          - profile: pppp
            environment_variable: APP_STORE_PROFILE
    scripts:
      - name: Set up keychain
        script: |
          keychain initialize
          keychain add-certificates
      - name: Fetch packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Install pods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Build signed .ipa
        script: |
          flutter build ipa --release \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=ios/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
