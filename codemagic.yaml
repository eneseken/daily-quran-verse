definitions:
  base_env: &base_env
    flutter: 3.38.2
    xcode: latest
    cocoapods: default
  ios_release_vars: &ios_release_vars
    BUNDLE_ID: com.muslim.pro

workflows:
  # ---------------------------------------------------------------------------
  # Unsigned build - runs immediately, no Apple Developer account required.
  # Use this to confirm the iOS target compiles on CI.
  # ---------------------------------------------------------------------------
  ios-unsigned:
    name: iOS build (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *base_env
    scripts:
      - name: Fetch packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Build unsigned .app
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app

  # ---------------------------------------------------------------------------
  # Signed release to TestFlight. Before this workflow can run, in Codemagic:
  #   1. Teams > Integrations > add an App Store Connect API key named
  #      `codemagic` (or rename the integration reference below).
  #   2. Register bundle id com.muslim.pro in your Apple Developer account.
  # ---------------------------------------------------------------------------
  ios-release:
    name: iOS release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: codemagic
    environment:
      <<: *base_env
      vars:
        <<: *ios_release_vars
      ios_signing:
        distribution_type: app_store
        bundle_identifier: $BUNDLE_ID
    scripts:
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Fetch packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Install pods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Build signed .ipa
        script: |
          flutter build ipa --release \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
